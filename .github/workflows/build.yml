
name: Build BotCooldown APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/persistent-synced-cooldown-notifications
      - integration/render-error-alerts-persistent-cooldowns
      - integration/combined-main-and-persistent-cooldowns

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar SDK de Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace --info

      - name: Guardar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: BotCooldown-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
